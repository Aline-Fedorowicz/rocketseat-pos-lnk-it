services:
  pg:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: lnk_it
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d lnk_it']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://docker:docker@pg:5432/lnk_it
    depends_on:
      pg:
        condition: service_healthy

volumes:
  postgres_data:
